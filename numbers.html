<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Numbers 1-20 | English Kids</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #fff8dc, #e0f7fa);
    text-align: center;
    margin: 0;
    padding: 20px;
}

h1 {
    color: #ff6f00;
    font-size: 38px;
}

.subtitle {
    font-size: 22px;
    color: #555;
    margin-bottom: 30px;
}


.numbers-container {

    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px,1fr));
    gap: 20px;
    max-width: 1000px;
    margin: auto;

}


.number-card {

    background: white;
    border-radius: 25px;
    padding: 25px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    transition: 0.3s;
}


.number-card:hover {

    transform: scale(1.08);

}


.number {

    font-size: 55px;
    font-weight: bold;
    color: #2196f3;

}


.word {

    font-size: 28px;
    color: #4caf50;
    margin: 15px;

}


button {

    background:#ff4081;
    color:white;
    border:none;
    border-radius:30px;
    padding:12px 25px;
    font-size:20px;
    cursor:pointer;

}


button:hover {

    background:#e91e63;

}


.listen-all {

    margin:30px;
    background:#9c27b0;

}


.quiz {

    background:white;
    border-radius:25px;
    padding:25px;
    margin:40px auto;
    max-width:600px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);

}


.quiz h2 {

    color:#ff5722;

}


</style>

</head>


<body>


<h1>🔢 Numbers 1–20</h1>

<div class="subtitle">

</div>


<button class="listen-all" onclick="playAll()">

<script>


function playSound(number){

let audio = new Audio("audio/number-" + number + ".mp3");

}

let audio = new Audio("audio/numbers-1-20.mp3");

audio.play();

</html>
